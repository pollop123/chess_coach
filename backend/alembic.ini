[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# env.py selects MIGRATION_DATABASE_URL first, then DATABASE_URL.  This
# placeholder keeps Alembic's standard configuration shape without embedding
# credentials in the repository.
sqlalchemy.url = sqlite:///games.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
