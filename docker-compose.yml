services:
  backend:
    # 指向後端資料夾，使用我們剛剛改好的 Dockerfile
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # API Key 不要寫死，要在雲端平台的變數設定中填寫
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ENABLE_CHROMA_RAG=${ENABLE_CHROMA_RAG:-0}
      - RAG_TIMEOUT_SECONDS=${RAG_TIMEOUT_SECONDS:-20}
      - DATABASE_URL=sqlite:////data/games.db
      - MIGRATION_DATABASE_URL=${MIGRATION_DATABASE_URL:-}
      - STOCKFISH_PATH=/usr/games/stockfish
      - STOCKFISH_REVIEW_NODES=${STOCKFISH_REVIEW_NODES:-4000}
      - STOCKFISH_REVIEW_QUICK_NODES=${STOCKFISH_REVIEW_QUICK_NODES:-50000}
      - STOCKFISH_REVIEW_DEEP_NODES=${STOCKFISH_REVIEW_DEEP_NODES:-500000}
      - STOCKFISH_REVIEW_MAX_REFINEMENTS=${STOCKFISH_REVIEW_MAX_REFINEMENTS:-12}
      - STOCKFISH_REVIEW_TIMEOUT_SECONDS=${STOCKFISH_REVIEW_TIMEOUT_SECONDS:-180}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      - ENGINE_MAX_CONCURRENT_SEARCHES=${ENGINE_MAX_CONCURRENT_SEARCHES:-1}
      - ENGINE_QUEUE_TIMEOUT_SECONDS=${ENGINE_QUEUE_TIMEOUT_SECONDS:-2.0}
    volumes:
      - backend_data:/data

  frontend:
    # 指向前端資料夾，使用我們剛剛新增的 Dockerfile
    build:
      context: ./frontend
    ports:
      - "80:80" # 前端通常對外開放 80 port
    depends_on:
      - backend

volumes:
  backend_data:
