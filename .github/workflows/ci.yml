name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # runner context is unavailable in job-level env, so export the paths here.
      - name: Configure the test database
        run: |
          echo "DATABASE_URL=sqlite:///${RUNNER_TEMP}/chess-ai-ci.db" >> "${GITHUB_ENV}"
          echo "MIGRATION_DATABASE_URL=sqlite:///${RUNNER_TEMP}/chess-ai-ci.db" >> "${GITHUB_ENV}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Upgrade the test database
        run: make db-upgrade

      - name: Run backend and frontend checks
        run: make verify

  teaching-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The oracle cache is gitignored, so this gate only passes where it was
    # calibrated. Non-blocking until the oracle is reproducible: see issue #7.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # runner context is unavailable in job-level env, so export the path here.
      - name: Configure the pinned Stockfish path
        run: |
          echo "STOCKFISH_PATH=${RUNNER_TEMP}/stockfish-18/stockfish-ubuntu-x86-64-avx2" \
            >> "${GITHUB_ENV}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Restore pinned Stockfish 18
        id: stockfish-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stockfish-18.tar
          key: stockfish-18-ubuntu-x86-64-avx2-536c0c2c0cf06450

      - name: Download pinned Stockfish 18
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
        run: |
          archive="${RUNNER_TEMP}/stockfish-18.tar"
          curl --fail --location --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar \
            --output "${archive}"

      - name: Verify and install pinned Stockfish 18
        run: |
          archive="${RUNNER_TEMP}/stockfish-18.tar"
          echo "536c0c2c0cf06450df0bfb5e876ef0d3119950703a8f143627f990c7b5417964  ${archive}" \
            | sha256sum --check
          mkdir -p "$(dirname "${STOCKFISH_PATH}")"
          tar --extract --file "${archive}" \
            --directory "$(dirname "${STOCKFISH_PATH}")" \
            --strip-components=1
          chmod +x "${STOCKFISH_PATH}"

      - name: Verify pinned Stockfish identity
        run: |
          test -x "${STOCKFISH_PATH}"
          printf 'uci\nquit\n' | "${STOCKFISH_PATH}" | grep -F "id name Stockfish 18"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run teaching accuracy regression gate
        run: make teaching-smoke

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teaching-smoke-report
          path: .artifacts/teaching-smoke.json
          if-no-files-found: ignore
