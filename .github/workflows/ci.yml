name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # runner context is unavailable in job-level env, so export the paths here.
      - name: Configure the test database
        run: |
          echo "DATABASE_URL=sqlite:///${RUNNER_TEMP}/chess-ai-ci.db" >> "${GITHUB_ENV}"
          echo "MIGRATION_DATABASE_URL=sqlite:///${RUNNER_TEMP}/chess-ai-ci.db" >> "${GITHUB_ENV}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Upgrade the test database
        run: make db-upgrade

      - name: Run backend and frontend checks
        run: make verify

  teaching-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      # The gate reads every oracle answer from the committed fixture
      # (--strict-oracle), so no Stockfish binary is needed here.
      - name: Run teaching accuracy regression gate
        run: make teaching-smoke

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teaching-smoke-report
          path: .artifacts/teaching-smoke.json
          if-no-files-found: ignore
